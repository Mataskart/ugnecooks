            PORT=3000 pm2 restart ugnecooks-api --update-env || PORT=3000 pm2 start index.js --name ugnecooks-api --interpreter node

            cd ../web
            pnpm install --frozen-lockfile || pnpm install
            pnpm build
            rsync -a --delete dist/ /var/www/ugnecooks/web/dist/

            sudo systemctl reload nginx
            pm2 save

      - name: Deploy via SSH (attempt 3)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
