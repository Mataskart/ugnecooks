name: Deploy Production

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (attempt 1)
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}   # set this secret to the IPv4: 72.62.3.54
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 20m
          script: |
            set -e
            export CI=true
            export VOLTA_HOME="$HOME/.volta"
            export PATH="$VOLTA_HOME/bin:$PATH"
            pnpm config set interactive false

            cd /srv/ugnecooks
            git fetch --all
            git reset --hard origin/main

            cd server
            pnpm install --frozen-lockfile || pnpm install
            pnpm prisma generate
            pnpm prisma migrate deploy
            PORT=3000 pm2 restart ugnecooks-api --update-env || PORT=3000 pm2 start index.js --name ugnecooks-api --interpreter node

            cd ../web
            pnpm install --frozen-lockfile || pnpm install
            pnpm build
            rsync -a --delete dist/ /var/www/ugnecooks/web/dist/

            sudo systemctl reload nginx
            pm2 save

      - name: Deploy via SSH (attempt 2)
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
